limit_req_zone $binary_remote_addr zone=tonalizador_api:10m rate=3r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tonalizador.xosemiguel.eu;
    return 301 https://$host$request_uri;
}

server {
    # Tailscale already owns 443 on its private address. Bind Nginx only to the
    # VPS public IPv4 address so both services can coexist.
    listen 178.104.107.105:443 ssl;
    server_name tonalizador.xosemiguel.eu;

    ssl_certificate /etc/letsencrypt/live/tonalizador.xosemiguel.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tonalizador.xosemiguel.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512k;

    location /api/ {
        limit_req zone=tonalizador_api burst=12 nodelay;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
